name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # the base install: no GPU stack
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      # the numbers of the paper, recomputed from results/per_question and configs/experiment.yaml (src/ftrim/paper.py)
      - run: uv run python -m ftrim report --check
      # the committed tables of results/RESULTS.md, README.md and docs/ are those that the code writes now
      # (tables.json holds unrounded floats and is not compared)
      - run: uv run python scripts/update_docs.py --check
      - run: git diff --exit-code -- results/RESULTS.md
